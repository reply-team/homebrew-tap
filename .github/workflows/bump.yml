# Keeps Formula/jason.rb at Jason's latest release. The script reads only https://jasonharness.ai, checks every archive
# against the release's manifest, and renders the formula; the formula is then committed here, tapped, and checked
# by brew itself, and the commit is pushed only when brew's style, audit, install and test all pass. A failure
# anywhere leaves main as it was: the runner is discarded with its commit unpushed.
name: bump

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read the latest release, check its archives, render the formula
        id: bump
        run: python3 .github/scripts/bump_formula.py bump

      - name: Commit the formula locally
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/jason.rb
          git commit -m "jason $VERSION"

      - name: Tap this checkout, with that commit
        if: steps.bump.outputs.changed == 'true'
        run: brew tap reply-team/tap "$GITHUB_WORKSPACE"

      # Homebrew 6 loads a formula from a tap that is not official only once it is trusted. This trusts the one
      # formula the steps below load, never the whole tap.
      - name: Trust this tap's formula
        if: steps.bump.outputs.changed == 'true'
        run: brew trust --formula reply-team/tap/jason

      - name: brew style
        if: steps.bump.outputs.changed == 'true'
        run: brew style reply-team/tap

      - name: brew audit
        if: steps.bump.outputs.changed == 'true'
        run: brew audit --strict reply-team/tap/jason

      - name: brew install
        if: steps.bump.outputs.changed == 'true'
        run: brew install reply-team/tap/jason

      - name: brew test
        if: steps.bump.outputs.changed == 'true'
        run: brew test reply-team/tap/jason

      # The last check: the short name a person upgrades by must resolve to this tap's formula, and Homebrew must
      # hold the release's version for it (from the archive's name alone it would read 64). Both are printed, and
      # either mismatch fails the job, so nothing is pushed.
      - name: Check the short name and the version
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          brew trust
          brew info jason
          brew info --json=v2 jason | python3 -c '
          import json, os, sys
          formula = json.load(sys.stdin)["formulae"][0]
          name, stable = formula["full_name"], formula["versions"]["stable"]
          print("full_name: %s" % name)
          print("versions.stable: %s" % stable)
          if name != "reply-team/tap/jason" or stable != os.environ["VERSION"]:
              sys.exit("FAIL: the short name must be reply-team/tap/jason at %s" % os.environ["VERSION"])
          '

      - name: Push the commit
        if: steps.bump.outputs.changed == 'true'
        run: git push origin HEAD:main
